name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the deploy job, which never runs for a pull
# request, gets the rights to publish.
permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  # Where the site is served from. Leave the repository variables unset to
  # use the GitHub Pages project URL; set them when moving to a custom domain
  # (see "Configuring the custom domain" in the README).
  SITE_URL: ${{ vars.SITE_URL || 'https://abdeljalilsennaoui.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/lemma-portfolio' }}

jobs:
  build:
    name: Check, build and verify links
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check internal links and asset paths
        run: npm run test:links

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
